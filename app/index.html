<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeSolid</title>
<style>
  :root {
    --bg: #17191c;
    --panel: #1e2126;
    --panel-2: #23272d;
    --line: #2e333a;
    --ink: #d7dce2;
    --ink-2: #8b939d;
    --accent: #4f8fdb;
    --error: #d4655c;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.45 system-ui, "Segoe UI", sans-serif;
    display: grid;
    grid-template-rows: auto 1fr 26px;
    grid-template-columns: 260px 1fr;
    grid-template-areas: "top top" "tree viewport" "status status";
    overflow: hidden;
  }

  header {
    grid-area: top;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  #topbar {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 12px 0;
  }
  #topbar .push { margin-left: auto; }
  header .tab {
    background: none; border: none; border-radius: 0;
    border-bottom: 2px solid transparent;
    padding: 7px 11px 5px;
    color: var(--ink-2); font-weight: 600; font-size: 12px;
  }
  header .tab:hover { color: var(--ink); }
  header .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .ribbon {
    display: none; align-items: center; flex-wrap: wrap;
    gap: 6px; row-gap: 4px;
    padding: 6px 12px;
    border-top: 1px solid var(--line);
  }
  .ribbon.active { display: flex; }
  header .sep, .ribbon .sep { width: 1px; height: 22px; background: var(--line); }
  header .logo { font-weight: 600; letter-spacing: 0.02em; margin-right: 12px; }
  header .logo span { color: var(--accent); }
  button {
    background: var(--panel-2);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button img { width: 16px; height: 16px; display: block; pointer-events: none; }
  header button, #sketchbar button, #viewbar button {
    display: inline-flex; align-items: center; gap: 6px;
  }

  #viewbar {
    position: absolute; top: 10px; right: 10px;
    display: flex; gap: 2px; z-index: 4;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px; padding: 4px;
  }
  #viewbar button { padding: 5px; border: none; background: none; }
  #viewbar button:hover { background: var(--panel-2); }

  aside {
    grid-area: tree;
    background: var(--panel);
    border-right: 1px solid var(--line);
    overflow-y: auto;
  }
  aside h2 {
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-2);
    padding: 10px 12px 6px;
  }
  #tree { list-style: none; }
  #tree li {
    padding: 5px 12px 5px 22px;
    cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #tree li:hover { background: var(--panel-2); }
  #tree li.body { padding-left: 12px; font-weight: 600; }
  #tree li.body .swatch {
    display: inline-block;
    width: 10px; height: 10px;
    margin-right: 6px; vertical-align: -1px;
    border: 1px solid var(--line); border-radius: 2px;
  }
  #tree li.body.active { color: var(--accent); }
  #tree li.body:not(.active) { color: var(--ink-2); cursor: pointer; }
  #tree li img {
    width: 15px; height: 15px;
    vertical-align: -3px; margin-right: 6px;
  }

  /* PropertyManager : remplace l'arbre pendant une commande, comme SW. */
  aside.panel-open h2, aside.panel-open #tree { display: none; }
  #panel { display: none; }
  aside.panel-open #panel { display: block; }
  #panel .phead-main {
    display: flex; align-items: center; gap: 7px;
    padding: 9px 10px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--line);
  }
  #panel .phead-main img { width: 18px; height: 18px; }
  #panel .ptitle {
    flex: 1; font-weight: 600; font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #panel .pok, #panel .pcancel {
    width: 28px; height: 28px; border-radius: 50%;
    padding: 0; font-size: 15px; line-height: 1; flex: none;
  }
  #panel .pok { color: #6fbf8f; border-color: #4a7c5d; }
  #panel .pok:hover { border-color: #6fbf8f; }
  #panel .pcancel { color: var(--error); border-color: #8a4a45; }
  #panel .pcancel:hover { border-color: var(--error); }
  #panel .paction {
    flex: none; height: 28px; padding: 0 8px;
    font-size: 11px; border-radius: 4px;
    color: var(--accent); border-color: var(--accent);
  }
  #panel .pcancel-text {
    width: auto; min-width: 28px; padding: 0 8px;
    border-radius: 4px; font-size: 11px;
  }
  .pgroup {
    border: 1px solid var(--line); border-radius: 6px;
    margin: 8px; overflow: hidden;
  }
  .pgroup .phead {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--panel-2);
    padding: 5px 9px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
    cursor: pointer; user-select: none;
  }
  .pgroup .parrow { color: var(--ink-2); transition: transform 0.1s; }
  .pgroup.closed .pbody { display: none; }
  .pgroup.closed .parrow { transform: rotate(-90deg); }
  .pbody { padding: 4px 0 6px; }
  .prow { display: flex; align-items: center; gap: 6px; padding: 4px 9px; }
  .prow label { flex: 1; color: var(--ink-2); font-size: 12px; }
  .prow label.pcheck {
    display: flex; align-items: center; gap: 7px;
    color: var(--ink); cursor: pointer;
  }
  .prow input[type="number"], .prow input[type="text"], .prow select {
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 3px 6px; font: inherit; font-size: 12px;
  }
  .prow input[type="number"] { width: 76px; }
  .prow input[type="text"] { flex: 1.3; min-width: 60px; }
  .plist-item {
    display: flex; justify-content: space-between; align-items: center;
    gap: 6px; padding: 3px 9px; font-size: 12px;
  }
  .plist-item .pdel {
    padding: 1px 7px; font-size: 11px; color: var(--error); flex: none;
  }
  .prow select { flex: 1.4; }
  .prow input[type="checkbox"] { accent-color: var(--accent); }
  .prow .punit { color: var(--ink-2); font-size: 11px; }
  .pselect-box {
    margin: 4px 9px; padding: 6px 8px;
    border: 1px dashed var(--line); border-radius: 4px;
    color: var(--ink-2); font-size: 12px;
  }
  .pselect-box.filled {
    border: 1px solid var(--accent); color: var(--accent);
  }
  .pnote { padding: 5px 12px 7px; font-size: 11px; color: var(--ink-2); }
  #tree li .arrow {
    display: inline-block; width: 13px;
    margin-left: -13px;
    color: var(--ink-2); font-size: 10px;
  }
  #tree li.plane { color: var(--ink-2); }
  #tree li.plane.sel,
  #tree li.sel { color: var(--accent); background: var(--panel-2); }
  #tree li.child { padding-left: 40px; }
  #tree li.sel-comp { color: var(--accent); background: var(--panel-2); }
  #tree li.error { color: var(--error); }
  #tree li .kind { color: var(--ink-2); }
  #tree li.rollback {
    color: var(--accent); font-size: 11px; text-align: center;
    border-top: 1px dashed var(--accent);
    border-bottom: 1px dashed var(--accent);
    margin: 3px 10px; padding: 2px;
    cursor: default;
  }

  main { grid-area: viewport; position: relative; }
  main canvas { display: block; }

  #sketchbar button.on { border-color: var(--accent); color: var(--accent); }
  #sketchbar .ok { color: #6fbf8f; }
  #sketchbar .no { color: var(--error); }

  footer {
    grid-area: status;
    display: flex; align-items: center; gap: 16px;
    padding: 0 12px;
    background: var(--panel);
    border-top: 1px solid var(--line);
    font-size: 12px; color: var(--ink-2);
  }
  footer .err { color: var(--error); }
  footer .push { margin-left: auto; }

  #ctxmenu {
    position: fixed; z-index: 10; display: none;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.5);
    min-width: 190px; padding: 4px;
  }
  #ctxmenu div {
    padding: 6px 10px; border-radius: 4px; cursor: pointer;
  }
  #ctxmenu div:hover { background: var(--panel); color: var(--accent); }
  #ctxmenu div.danger:hover { color: var(--error); }
</style>
</head>
<body>
  <header>
    <div id="topbar">
      <div class="logo">Free<span>Solid</span></div>
      <button class="tab active" data-tab="features">Fonctions</button>
      <button class="tab" data-tab="sketch">Esquisse</button>
      <button class="tab" data-tab="surfaces">Surfaces</button>
      <button class="tab" data-tab="assembly">Assemblage</button>
      <span class="push"></span>
      <button id="btn-new" title="Nouvelle pièce"><img src="icons/document-new.svg" alt=""></button>
      <button id="btn-undo" title="Annuler (Ctrl+Z)"><img src="icons/edit-undo.svg" alt=""></button>
      <button id="btn-redo" title="Rétablir (Ctrl+Y)"><img src="icons/edit-redo.svg" alt=""></button>
      <button id="btn-equations" title="Équations — variables globales pour piloter cotes et fonctions"><img src="icons/VarSet.svg" alt=""></button>
      <button id="btn-evaluate" title="Évaluer — volume, masse (densité), centre de gravité"><img src="icons/view-measurement.svg" alt=""></button>
      <button id="btn-measure" title="Mesurer — distance entre deux faces ou arêtes">Mesurer</button>
      <div class="sep"></div>
      <button id="btn-open" title="Ouvrir un .FCStd"><img src="icons/document-open.svg" alt=""></button>
      <button id="btn-save" title="Enregistrer (.FCStd)"><img src="icons/document-save.svg" alt=""></button>
      <button id="btn-export" title="Exporter en STL (impression 3D) ou STEP"><img src="icons/document-save-as.svg" alt=""></button>
      <button id="btn-drawing" title="Mise en plan — Face / Dessus / Iso, cotes d'encombrement, coupe, export DXF"><img src="icons/TechDraw_PageDefault.svg" alt=""></button>
      <button id="btn-selftest">Autotest</button>
    </div>
    <div id="ribbon-features" class="ribbon active">
      <button id="btn-sketch"><img src="icons/Sketcher_NewSketch.svg" alt="">Esquisse</button>
      <button id="btn-datum" title="Plan de référence — décalé d'un plan ou d'une face"><img src="icons/PartDesign_Plane.svg" alt="">Plan de référence</button>
      <button id="btn-body" title="Nouveau corps — pièce multi-corps"><img src="icons/PartDesign_Body.svg" alt="">Corps</button>
      <button id="btn-boolean" title="Combiner deux corps : Soustraire / Ajouter / Intersection"><img src="icons/PartDesign_Boolean.svg" alt="">Combiner</button>
      <div class="sep"></div>
      <button id="btn-pad" title="Bossage/Base extrudé"><img src="icons/PartDesign_Pad.svg" alt="">Bossage extrudé</button>
      <button id="btn-revolution" title="Bossage/Base avec révolution — autour de l'axe vertical de l'esquisse"><img src="icons/PartDesign_Revolution.svg" alt="">Révolution</button>
      <button id="btn-pocket" title="Enlèvement de matière extrudé"><img src="icons/PartDesign_Pocket.svg" alt="">Enlèvement de matière</button>
      <button id="btn-groove" title="Enlèvement de matière avec révolution"><img src="icons/PartDesign_Groove.svg" alt="">Enlèv. révolution</button>
      <button id="btn-hole" title="Assistant de perçage — une esquisse de cercles positionne les trous"><img src="icons/PartDesign_Hole.svg" alt="">Assistant de perçage</button>
      <button id="btn-loft" title="Bossage/Base lissé — plusieurs profils, souvent sur des plans de référence"><img src="icons/PartDesign_AdditiveLoft.svg" alt="">Lissage</button>
      <button id="btn-sweep" title="Bossage/Base balayé — un profil suit une trajectoire"><img src="icons/PartDesign_AdditivePipe.svg" alt="">Balayage</button>
      <button id="btn-helix" title="Hélice — ressorts, filets réels"><img src="icons/PartDesign_AdditiveHelix.svg" alt="">Hélice</button>
      <button id="btn-text" title="Gravure / bossage de texte sur une face — marquage de pièces"><img src="icons/Draft_ShapeString.svg" alt="">Texte</button>
      <div class="sep"></div>
      <button id="btn-fillet"><img src="icons/PartDesign_Fillet.svg" alt="">Congé</button>
      <button id="btn-chamfer"><img src="icons/PartDesign_Chamfer.svg" alt="">Chanfrein</button>
      <button id="btn-shell" title="Coque — la face cliquée devient l'ouverture"><img src="icons/PartDesign_Thickness.svg" alt="">Coque</button>
      <button id="btn-draft" title="Dépouille de la face cliquée (plan neutre : Plan de dessus)"><img src="icons/PartDesign_Draft.svg" alt="">Dépouille</button>
      <div class="sep"></div>
      <button id="btn-linpattern" title="Répétition linéaire de la dernière fonction"><img src="icons/PartDesign_LinearPattern.svg" alt="">Rép. linéaire</button>
      <button id="btn-polpattern" title="Répétition circulaire de la dernière fonction"><img src="icons/PartDesign_PolarPattern.svg" alt="">Rép. circulaire</button>
      <button id="btn-mirror" title="Symétrie de la dernière fonction par rapport à un plan d'origine"><img src="icons/PartDesign_Mirrored.svg" alt="">Symétrie</button>
    </div>
    <div id="ribbon-surfaces" class="ribbon">
      <button id="btn-surf-extrude" title="Surface extrudée — le profil peut être ouvert"><img src="icons/Surface_Filling.svg" alt="">Surface extrudée</button>
      <button id="btn-surf-revolve" title="Surface de révolution — autour de l'axe vertical de l'esquisse"><img src="icons/PartDesign_Revolution.svg" alt="">Surface de révolution</button>
      <button id="btn-surf-loft" title="Surface lissée entre plusieurs profils"><img src="icons/PartDesign_AdditiveLoft.svg" alt="">Surface lissée</button>
      <div class="sep"></div>
      <button id="btn-surf-sew" title="Coudre des surfaces — solidifie si la peau est fermée"><img src="icons/Part_3D_object.svg" alt="">Coudre</button>
      <button id="btn-surf-thicken" title="Épaissir une surface en solide"><img src="icons/PartDesign_Thickness.svg" alt="">Épaissir</button>
      <div class="sep"></div>
      <button id="btn-curve3d" title="Courbe 3D par points — trajectoire de balayage (le repli esquisse 3D)"><img src="icons/Sketcher_Create3PointArc.svg" alt="">Courbe 3D</button>
    </div>
    <div id="ribbon-assembly" class="ribbon">
      <button id="btn-newasm" title="Nouvel assemblage — pièces insérées par référence"><img src="icons/Geoassembly.svg" alt="">Nouvel assemblage</button>
      <button id="btn-insert" title="Insérer une pièce (.FCStd) — chaque instance est un lien vers le fichier"><img src="icons/Link.svg" alt="">Insérer une pièce</button>
      <button id="btn-move" title="Déplacer le composant sélectionné (translation + rotations)">Déplacer</button>
      <button id="btn-joint" title="Contrainte d'assemblage — deux faces, le solveur repositionne"><img src="icons/Geoassembly.svg" alt="">Contrainte</button>
      <button id="btn-array-comp" title="Répéter le composant sélectionné au pas choisi"><img src="icons/LinkArray.svg" alt="">Répéter</button>
      <button id="btn-solve" title="Relancer le solveur d'assemblage">Résoudre</button>
      <div class="sep"></div>
      <button id="btn-interf" title="Détection d'interférences — volume commun par paires de composants">Interférences</button>
      <button id="btn-explode" title="Vue éclatée (visuel) — les composants s'écartent, re-cliquer les ramène">Éclater</button>
    </div>
    <div id="sketchbar" class="ribbon">
      <button data-tool="select" title="Sélectionner — glisser un point, cliquer des entités">Sélectionner</button>
      <button data-tool="line" title="Ligne (L)"><img src="icons/Sketcher_CreateLine.svg" alt=""></button>
      <button data-tool="rect" title="Rectangle par sommet (R)"><img src="icons/Sketcher_CreateRectangle.svg" alt=""></button>
      <button data-tool="rectc" title="Rectangle par le centre"><img src="icons/Sketcher_CreateRectangle_Center.svg" alt=""></button>
      <button data-tool="circle" title="Cercle (C)"><img src="icons/Sketcher_CreateCircle.svg" alt=""></button>
      <button data-tool="spline" title="Spline (S) — points cliqués, Entrée pour terminer"><img src="icons/Sketcher_CreateBSpline.svg" alt=""></button>
      <button data-tool="ellipse" title="Ellipse (E) — centre, grand axe, petit rayon"><img src="icons/Sketcher_CreateEllipseByCenter.svg" alt=""></button>
      <button data-tool="arc" title="Arc par centre — centre, départ, arrivée"><img src="icons/Sketcher_CreateArc.svg" alt=""></button>
      <button data-tool="arc3" title="Arc 3 points (A) — départ, arrivée, passage"><img src="icons/Sketcher_Create3PointArc.svg" alt=""></button>
      <button data-tool="slot" title="Rainure droite — deux centres puis largeur"><img src="icons/Sketcher_CreateSlot.svg" alt=""></button>
      <button data-tool="polygon" title="Polygone — nombre de côtés, centre, sommet"><img src="icons/Sketcher_CreateRegularPolygon.svg" alt=""></button>
      <button data-tool="skfillet" title="Congé d'esquisse — cliquez deux lignes près du coin"><img src="icons/Sketcher_CreateFillet.svg" alt=""></button>
      <button data-tool="trim" title="Ajuster les entités (T) — cliquez le tronçon à supprimer"><img src="icons/Sketcher_Trimming.svg" alt=""></button>
      <button data-tool="construction" title="Géométrie de construction (G) — cliquez une entité"><img src="icons/Sketcher_ToggleConstruction.svg" alt=""></button>
      <button id="sk-convert" title="Convertir les entités — le contour de la face porteuse devient de la géométrie bloquée"><img src="icons/Sketcher_Projection.svg" alt=""></button>
      <button data-tool="dim" title="Cotation intelligente (D) — 1 ou 2 entités, cote pilotante"><img src="icons/Constraint_Dimension.svg" alt=""></button>
      <div class="sep"></div>
      <button id="sk-c-horizontal" title="Relation horizontale"><img src="icons/Constraint_Horizontal.svg" alt=""></button>
      <button id="sk-c-vertical" title="Relation verticale"><img src="icons/Constraint_Vertical.svg" alt=""></button>
      <button id="sk-c-coincident" title="Relation coïncidente — deux points"><img src="icons/Constraint_Coincident.svg" alt=""></button>
      <button id="sk-c-parallel" title="Relation parallèle"><img src="icons/Constraint_Parallel.svg" alt=""></button>
      <button id="sk-c-perpendicular" title="Relation perpendiculaire"><img src="icons/Constraint_Perpendicular.svg" alt=""></button>
      <button id="sk-c-tangent" title="Relation tangente"><img src="icons/Constraint_Tangent.svg" alt=""></button>
      <button id="sk-c-equal" title="Relation égale"><img src="icons/Constraint_EqualLength.svg" alt=""></button>
      <button id="sk-c-concentric" title="Relation concentrique — deux cercles ou arcs"><img src="icons/Constraint_Concentric.svg" alt=""></button>
      <button id="sk-c-collinear" title="Relation colinéaire — deux lignes"><img src="icons/FreeSolid_Collinear.svg" alt=""></button>
      <button id="sk-c-midpoint" title="Relation milieu — un point et une ligne"><img src="icons/Constraint_PointOnMidPoint.svg" alt=""></button>
      <button id="sk-c-symmetric" title="Relation symétrique — deux points puis la ligne d'axe"><img src="icons/Constraint_Symmetric.svg" alt=""></button>
      <button id="sk-c-fixed" title="Relation fixe — bloque l'entité"><img src="icons/Constraint_Block.svg" alt=""></button>
      <button id="sk-mirror" title="Symétrie d'entités — sélectionnez les entités puis la ligne d'axe en dernier"><img src="icons/Sketcher_Symmetry.svg" alt=""></button>
      <button id="sk-array" title="Répétition d'entités — grille au pas choisi"><img src="icons/Sketcher_RectangularArray.svg" alt=""></button>
      <button id="sk-offset" title="Décaler les entités — sélectionnez une chaîne, puis la distance">Décaler</button>
      <button id="sk-image" title="Image d'esquisse — calque de fond pour redessiner un scan ou un logo">Image</button>
      <button id="sk-relations" title="Relations de l'entité sélectionnée — voir et supprimer"><img src="icons/Sketcher_ToggleConstraint.svg" alt=""></button>
      <div class="sep"></div>
      <button id="sk-finish" class="ok" title="Fermer l'esquisse et reconstruire"><img src="icons/Sketcher_LeaveSketch.svg" alt="">Terminer</button>
      <button id="sk-cancel" class="no"><img src="icons/Sketcher_CancelSketch.svg" alt="">Quitter</button>
    </div>
  </header>

  <aside>
    <h2>FeatureManager</h2>
    <ul id="tree"><li class="body">— aucun document —</li></ul>
    <div id="panel"></div>
  </aside>

  <main id="viewport">
    <div id="viewbar">
      <button id="view-iso" title="Vue isométrique (Ctrl+7)"><img src="icons/view-isometric.svg" alt=""></button>
      <button id="view-front" title="Vue de face (Ctrl+1)"><img src="icons/view-front.svg" alt=""></button>
      <button id="view-top" title="Vue de dessus (Ctrl+5)"><img src="icons/view-top.svg" alt=""></button>
      <button id="view-right" title="Vue de droite (Ctrl+4)"><img src="icons/view-right.svg" alt=""></button>
      <button id="view-fit" title="Zoom au mieux (F)"><img src="icons/zoom-fit-best.svg" alt=""></button>
      <button id="btn-clip" title="Plan de coupe visuel — voir l'intérieur sans couper la pièce"><img src="icons/Std_ToggleClipPlane.svg" alt=""></button>
    </div>
      </main>
  <div id="ctxmenu">
    <div id="ctx-rename">Renommer</div>
    <div id="ctx-color" hidden>Couleur…</div>
    <div id="ctx-color-reset" hidden>Couleur par défaut</div>
    <div id="ctx-rollback">Amener la barre de retour ici</div>
    <div id="ctx-end">Revenir à l'état final</div>
    <div id="ctx-delete" class="danger">Supprimer</div>
  </div>

  <footer>
    <span id="status">Moteur : en attente…</span>
    <span id="pick" class="push"></span>
    <span>MMGS</span>
  </footer>

  <input type="file" id="sk-image-file" accept="image/*" hidden>
  <input type="color" id="body-color-picker" value="#9fb2c4"
    style="position:fixed;left:-9999px;width:0;height:0;opacity:0" tabindex="-1">

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
