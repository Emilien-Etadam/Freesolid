# Vérifie l'application de bureau (desktop/) sans la packager :
# tests du crate FreeCAD, compilation de la coquille Tauri, écran de lancement.
name: Desktop

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Dépendances Linux (webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libxdo-dev libssl-dev
      - name: Format
        working-directory: desktop/src-tauri
        run: cargo fmt --check
      - name: Tests du crate FreeCAD (pur, sans Tauri)
        working-directory: desktop/src-tauri
        run: cargo test -p freesolid-freecad
      - name: Compilation de l'application
        working-directory: desktop/src-tauri
        run: cargo check --locked
      - name: L'écran de lancement est du JS valide
        run: |
          node -e "const s=require('fs').readFileSync('desktop/ui/index.html','utf8');
                   new Function(s.match(/<script>([\s\S]*)<\/script>/)[1]);"
