name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest
      # Byte-compiles everything, including the modules that import FreeCAD
      # at call time and therefore cannot be imported in CI.
      - name: Byte-compile
        run: python -m compileall -q freesolid engine Init.py InitGui.py
      - name: Unit tests
        run: python -m pytest -q

  selftest:
    name: Selftest headless (FreeCAD réel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: freecad
          create-args: >-
            python=3.11
            freecad=1.0.2
          cache-environment: true
      - name: Selftest
        shell: bash -el {0}
        run: PYTHONIOENCODING=utf-8 freecadcmd scripts/run-selftest.py
