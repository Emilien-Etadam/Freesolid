<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeSolid</title>
<style>
  :root {
    --bg: #181a1f; --panel: #20232a; --line: #2e323b; --fg: #e6e8ee;
    --muted: #9aa1ad; --accent: #60a5fa; --accent-2: #2563eb; --warn: #f59e0b;
    --err: #f87171; --ok: #34d399;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
  }
  .card {
    width: min(560px, 92vw); background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 28px 32px; box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .brand svg { width: 44px; height: 44px; flex: none; }
  .brand h1 { font-size: 22px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .brand small { color: var(--muted); display: block; font-size: 12px; }
  .status { min-height: 48px; margin: 8px 0 16px; }
  .status .title { font-weight: 600; }
  .status .detail { color: var(--muted); font-size: 13px; word-break: break-all; }
  .warn { color: var(--warn); }
  .err { color: var(--err); white-space: pre-wrap; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; max-height: 180px; overflow: auto; }
  .ok { color: var(--ok); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 10px 0 6px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .bar.indeterminate > i { width: 30%; animation: slide 1.2s infinite ease-in-out; }
  @keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  button {
    font: inherit; padding: 8px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: #262a33; color: var(--fg);
  }
  button.primary { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .update {
    display: none; margin: -6px 0 16px; padding: 10px 12px; border-radius: 8px;
    background: #1e2a3f; border: 1px solid #2b3f63; font-size: 13px;
    align-items: center; gap: 10px;
  }
  .update.show { display: flex; }
  .update span { flex: 1; }
  .foot { margin-top: 18px; color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--muted); border-top-color: var(--fg); border-radius: 50%; animation: rot .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes rot { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,12 84,31 50,50 16,31" fill="#60a5fa"/>
      <polygon points="16,31 50,50 50,88 16,69" fill="#2563eb"/>
      <polygon points="84,31 50,50 50,88 84,69" fill="#1e40af"/>
    </svg>
    <div><h1>FreeSolid</h1><small id="app-version" data-fr="application de bureau">application de bureau</small></div>
  </div>

  <div class="update" id="update">
    <span id="update-text"></span>
    <button id="update-btn" class="primary" data-fr="Installer">Installer</button>
  </div>

  <div class="status">
    <div class="title" id="title"><span class="spin"></span><span data-fr="Recherche de FreeCAD…">Recherche de FreeCAD…</span></div>
    <div class="detail" id="detail"></div>
    <div class="bar" id="bar" hidden><i id="bar-fill"></i></div>
    <div class="err" id="error" hidden></div>
  </div>

  <div class="actions" id="actions"></div>

  <div class="foot">
    <span id="foot-left"></span>
    <span id="foot-right"></span>
  </div>
</div>

<script>
(() => {
  const T = window.__TAURI__;
  const invoke = T.core.invoke;

  // Bilingue : français source, anglais si la langue du système commence
  // par « en ». (Le choix fait dans l'interface vit dans l'autre fenêtre.)
  const EN = {
    "Recherche de FreeCAD…": "Looking for FreeCAD…",
    "Vérification…": "Checking…",
    "Téléchargement de FreeCAD {v}…": "Downloading FreeCAD {v}…",
    "Vérification de l'archive…": "Verifying the archive…",
    "Extraction…": "Extracting…",
    "Démarrage du moteur FreeCAD…": "Starting the FreeCAD engine…",
    "Moteur prêt": "Engine ready",
    "FreeCAD introuvable sur cette machine": "FreeCAD not found on this machine",
    "Changer de FreeCAD…": "Change FreeCAD…",
    "Choisir freecadcmd…": "Choose freecadcmd…",
    "Choisir le dossier FreeCAD…": "Choose the FreeCAD folder…",
    "Installer FreeCAD {v} automatiquement (≈ 800 Mo)": "Install FreeCAD {v} automatically (≈ 800 MB)",
    "J'ai déjà FreeCAD : choisir freecadcmd…": "I already have FreeCAD: choose freecadcmd…",
    "Réessayer": "Retry",
    "Depuis les releases officielles de FreeCAD, vérifié par SHA-256. Une seule fois.": "From the official FreeCAD releases, SHA-256 verified. Once only.",
    "Dans {d}": "Into {d}",
    "application de bureau · v{v}": "desktop application · v{v}",
    "application de bureau": "desktop application",
    "référence FreeCAD {v}": "FreeCAD reference {v}",
    "FreeSolid {v} est disponible (vous avez {c}).": "FreeSolid {v} is available (you have {c}).",
    "Redémarrage…": "Restarting…",
    "Mise à jour impossible : {e}": "Update failed: {e}",
    "Installer": "Install",
    "variable FREESOLID_FREECADCMD": "FREESOLID_FREECADCMD variable",
    "votre choix": "your choice",
    "installé par FreeSolid": "installed by FreeSolid",
    "installation système": "system installation",
    "Version différente de la référence {v} : FreeSolid fonctionne, mais certaines fonctions peuvent manquer.": "Version differs from the reference {v}: FreeSolid works, but some features may be missing.",
    "FreeSolid a besoin de FreeCAD {v} (moteur de géométrie, exécuté en local, sans interface).": "FreeSolid needs FreeCAD {v} (geometry engine, run locally, without its interface).",
    "Pas d'archive automatique pour {p} : installez FreeCAD depuis freecad.org puis indiquez son emplacement.": "No automatic archive for {p}: install FreeCAD from freecad.org then point to its location.",
    "FreeCAD non reconnu": "FreeCAD not recognized",
    "Installation impossible": "Installation failed",
    "Le moteur n'a pas démarré": "The engine did not start",
    "Erreur au démarrage": "Startup error",
    "Journal : {p}": "Log: {p}",
    "Choisir freecadcmd (ou le dossier de FreeCAD)": "Choose freecadcmd (or the FreeCAD folder)",
    "Dossier de FreeCAD": "FreeCAD folder",
    "Fermer": "Close"
};
  const LANG = String(navigator.language || "").toLowerCase().startsWith("en") ? "en" : "fr";
  document.documentElement.lang = LANG;
  const tr = (text, vars) => {
    let out = LANG === "en" && Object.hasOwn(EN, text) ? EN[text] : text;
    if (vars) out = out.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
    return out;
  };
  const $ = (id) => document.getElementById(id);
  const fmtMo = (n) => (n / 1048576).toFixed(0) + " Mo";

  let status = null;

  function setTitle(html) { $("title").innerHTML = html; }
  function setDetail(html) { $("detail").innerHTML = html; }
  function setError(text) {
    const el = $("error");
    el.hidden = !text; el.textContent = text || "";
  }
  function setBar(fraction) {
    const bar = $("bar");
    if (fraction === null) { bar.hidden = true; bar.classList.remove("indeterminate"); return; }
    bar.hidden = false;
    if (fraction === undefined) { bar.classList.add("indeterminate"); return; }
    bar.classList.remove("indeterminate");
    $("bar-fill").style.width = Math.max(0, Math.min(100, fraction * 100)) + "%";
  }
  function setActions(list) {
    const box = $("actions"); box.innerHTML = "";
    for (const a of list) {
      const b = document.createElement("button");
      b.textContent = a.label; if (a.primary) b.className = "primary";
      b.onclick = () => { for (const x of box.children) x.disabled = true; a.run(); };
      box.appendChild(b);
    }
  }
  function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

  async function chooseFreecad() {
    const picked = await T.dialog.open({
      multiple: false, directory: false,
      title: tr("Choisir freecadcmd (ou le dossier de FreeCAD)"),
    });
    if (!picked) { render(); return; }
    setTitle('<span class="spin"></span>' + esc(tr("Vérification…"))); setError(""); setActions([]);
    try {
      status = await invoke("choose_freecadcmd", { path: picked });
      render();
    } catch (e) { showFailure(tr("FreeCAD non reconnu"), String(e)); }
  }

  async function chooseFreecadDir() {
    const picked = await T.dialog.open({ multiple: false, directory: true, title: tr("Dossier de FreeCAD") });
    if (!picked) { render(); return; }
    setTitle('<span class="spin"></span>' + esc(tr("Vérification…"))); setError(""); setActions([]);
    try {
      status = await invoke("choose_freecadcmd", { path: picked });
      render();
    } catch (e) { showFailure(tr("FreeCAD non reconnu"), String(e)); }
  }

  function showFailure(title, message, extra) {
    setTitle('<span class="err">' + esc(title) + '</span>');
    setBar(null); setError(message);
    setActions([
      { label: tr("Réessayer"), primary: true, run: boot },
      { label: tr("Choisir freecadcmd…"), run: chooseFreecad },
      { label: tr("Choisir le dossier FreeCAD…"), run: chooseFreecadDir },
      ...(extra || []),
    ]);
  }

  async function install() {
    setError(""); setActions([]);
    setTitle('<span class="spin"></span>' + esc(tr("Téléchargement de FreeCAD {v}…", { v: status.reference })));
    setDetail(esc(tr("Depuis les releases officielles de FreeCAD, vérifié par SHA-256. Une seule fois.")));
    setBar(undefined);
    const unlisten = await T.event.listen("install-progress", (ev) => {
      const p = ev.payload;
      if (p.phase === "downloading") {
        if (p.total) { setBar(p.done / p.total); setDetail(fmtMo(p.done) + " / " + fmtMo(p.total)); }
        else { setBar(undefined); setDetail(fmtMo(p.done)); }
      } else if (p.phase === "verifying") {
        setTitle('<span class="spin"></span>' + esc(tr("Vérification de l'archive…"))); setBar(undefined);
      } else if (p.phase === "extracting") {
        setTitle('<span class="spin"></span>' + esc(tr("Extraction…"))); setBar(undefined);
        setDetail(esc(tr("Dans {d}", { d: status.install_dir })));
      }
    });
    try {
      status = await invoke("install_freecad");
      unlisten();
      setBar(null);
      render();
    } catch (e) {
      unlisten();
      showFailure(tr("Installation impossible"), String(e));
    }
  }

  async function start() {
    setError(""); setActions([{ label: tr("Changer de FreeCAD…"), run: chooseFreecad }]);
    setTitle('<span class="spin"></span>' + esc(tr("Démarrage du moteur FreeCAD…")));
    setBar(undefined);
    try {
      await invoke("start_engine");
      // La fenêtre navigue vers l'interface ; rien d'autre à faire ici.
      setTitle('<span class="ok">' + esc(tr("Moteur prêt")) + '</span>'); setBar(null);
    } catch (e) {
      let log = "";
      try { log = await invoke("engine_log_path"); } catch (_) {}
      showFailure(tr("Le moteur n'a pas démarré"), String(e) + (log ? "\n\n" + tr("Journal : {p}", { p: log }) : ""));
    }
  }

  function render() {
    setBar(null); setError("");
    $("app-version").textContent = tr("application de bureau · v{v}", { v: status.app_version });
    $("foot-left").textContent = status.os + " / " + status.arch;
    $("foot-right").textContent = tr("référence FreeCAD {v}", { v: status.reference });
    if (status.freecadcmd) {
      const where = { env: tr("variable FREESOLID_FREECADCMD"), config: tr("votre choix"), managed: tr("installé par FreeSolid"),
                      path: "PATH", standard: tr("installation système") }[status.source] || status.source;
      setTitle("FreeCAD " + esc(status.version) + " <span class=\"detail\">(" + esc(where) + ")</span>");
      let d = esc(status.freecadcmd);
      if (!status.matches_reference) {
        d += '<br><span class="warn">' + esc(tr("Version différente de la référence {v} : FreeSolid fonctionne, mais certaines fonctions peuvent manquer.", { v: status.reference })) + "</span>";
      }
      setDetail(d);
      start();
      return;
    }
    setTitle('<span class="warn">' + esc(tr("FreeCAD introuvable sur cette machine")) + '</span>');
    setDetail(esc(tr("FreeSolid a besoin de FreeCAD {v} (moteur de géométrie, exécuté en local, sans interface).", { v: status.reference })));
    const actions = [];
    if (status.can_install) {
      actions.push({ label: tr("Installer FreeCAD {v} automatiquement (≈ 800 Mo)", { v: status.reference }), primary: true, run: install });
    } else {
      setDetail(esc(tr("Pas d'archive automatique pour {p} : installez FreeCAD depuis freecad.org puis indiquez son emplacement.", { p: status.os + "/" + status.arch })));
    }
    actions.push({ label: tr("J'ai déjà FreeCAD : choisir freecadcmd…"), run: chooseFreecad });
    actions.push({ label: tr("Choisir le dossier FreeCAD…"), run: chooseFreecadDir });
    setActions(actions);
  }

  async function boot() {
    setTitle('<span class="spin"></span>' + esc(tr("Recherche de FreeCAD…"))); setDetail(""); setError(""); setActions([]); setBar(null);
    try {
      status = await invoke("status");
      render();
    } catch (e) {
      showFailure(tr("Erreur au démarrage"), String(e));
    }
  }

  async function checkUpdate() {
    // Silencieux si hors ligne ou si la release n'a pas de latest.json.
    let update = null;
    try { update = await T.updater.check(); } catch (_) { return; }
    if (!update) return;
    const box = $("update");
    $("update-text").textContent = tr("FreeSolid {v} est disponible (vous avez {c}).", { v: update.version, c: update.currentVersion });
    box.classList.add("show");
    $("update-btn").onclick = async () => {
      const btn = $("update-btn"); btn.disabled = true;
      let total = 0, done = 0;
      try {
        await update.downloadAndInstall((ev) => {
          if (ev.event === "Started") { total = ev.data.contentLength || 0; }
          else if (ev.event === "Progress") { done += ev.data.chunkLength; btn.textContent = total ? Math.round(100 * done / total) + " %" : fmtMo(done); }
          else if (ev.event === "Finished") { btn.textContent = tr("Redémarrage…"); }
        });
        await T.process.relaunch();
      } catch (e) {
        btn.disabled = false; btn.textContent = tr("Réessayer");
        $("update-text").textContent = tr("Mise à jour impossible : {e}", { e });
      }
    };
  }

  for (const el of document.querySelectorAll("[data-fr]")) el.textContent = tr(el.dataset.fr);
  checkUpdate();
  boot();
})();
</script>
</body>
</html>
