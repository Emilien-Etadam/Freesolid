name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest
      # Byte-compiles everything, including the modules that import FreeCAD
      # at call time and therefore cannot be imported in CI.
      - name: Byte-compile
        run: python -m compileall -q freesolid engine Init.py InitGui.py
      - name: Unit tests
        run: python -m pytest -q
