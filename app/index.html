<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeSolid</title>
<style>
  :root {
    --bg: #17191c;
    --panel: #1e2126;
    --panel-2: #23272d;
    --line: #2e333a;
    --ink: #d7dce2;
    --ink-2: #8b939d;
    --accent: #4f8fdb;
    --error: #d4655c;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.45 system-ui, "Segoe UI", sans-serif;
    display: grid;
    grid-template-rows: 44px 1fr 26px;
    grid-template-columns: 260px 1fr;
    grid-template-areas: "top top" "tree viewport" "status status";
    overflow: hidden;
  }

  header {
    grid-area: top;
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header .logo { font-weight: 600; letter-spacing: 0.02em; margin-right: 12px; }
  header .logo span { color: var(--accent); }
  button {
    background: var(--panel-2);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  aside {
    grid-area: tree;
    background: var(--panel);
    border-right: 1px solid var(--line);
    overflow-y: auto;
  }
  aside h2 {
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-2);
    padding: 10px 12px 6px;
  }
  #tree { list-style: none; }
  #tree li {
    padding: 5px 12px 5px 22px;
    cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #tree li:hover { background: var(--panel-2); }
  #tree li.body { padding-left: 12px; font-weight: 600; }
  #tree li.error { color: var(--error); }
  #tree li .kind { color: var(--ink-2); }
  #tree li.rollback {
    color: var(--accent); font-size: 11px; text-align: center;
    border-top: 1px dashed var(--accent);
    border-bottom: 1px dashed var(--accent);
    margin: 3px 10px; padding: 2px;
    cursor: default;
  }

  main { grid-area: viewport; position: relative; }
  main canvas { display: block; }

  footer {
    grid-area: status;
    display: flex; align-items: center; gap: 16px;
    padding: 0 12px;
    background: var(--panel);
    border-top: 1px solid var(--line);
    font-size: 12px; color: var(--ink-2);
  }
  footer .err { color: var(--error); }
  footer .push { margin-left: auto; }
</style>
</head>
<body>
  <header>
    <div class="logo">Free<span>Solid</span></div>
    <button id="btn-new">Nouvelle pièce</button>
    <button id="btn-sketch">Esquisse rectangle</button>
    <button id="btn-pad">Bossage extrudé</button>
    <button id="btn-pocket">Enlèvement de matière</button>
    <button id="btn-fillet">Congé</button>
    <button id="btn-chamfer">Chanfrein</button>
    <button id="btn-save">Enregistrer</button>
    <button id="btn-selftest">Selftest</button>
  </header>

  <aside>
    <h2>FeatureManager</h2>
    <ul id="tree"><li class="body">— aucun document —</li></ul>
  </aside>

  <main id="viewport"></main>

  <footer>
    <span id="status">Moteur : en attente…</span>
    <span id="pick" class="push"></span>
    <span>MMGS</span>
  </footer>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
