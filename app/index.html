<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeSolid</title>
<style>
  :root {
    --bg: #17191c;
    --panel: #1e2126;
    --panel-2: #23272d;
    --line: #2e333a;
    --ink: #d7dce2;
    --ink-2: #8b939d;
    --accent: #4f8fdb;
    --error: #d4655c;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.45 system-ui, "Segoe UI", sans-serif;
    display: grid;
    grid-template-rows: 44px 1fr 26px;
    grid-template-columns: 260px 1fr;
    grid-template-areas: "top top" "tree viewport" "status status";
    overflow: hidden;
  }

  header {
    grid-area: top;
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header .logo { font-weight: 600; letter-spacing: 0.02em; margin-right: 12px; }
  header .logo span { color: var(--accent); }
  button {
    background: var(--panel-2);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button img { width: 16px; height: 16px; display: block; pointer-events: none; }
  header button, #sketchbar button, #viewbar button {
    display: inline-flex; align-items: center; gap: 6px;
  }

  #viewbar {
    position: absolute; top: 10px; right: 10px;
    display: flex; gap: 2px; z-index: 4;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px; padding: 4px;
  }
  #viewbar button { padding: 5px; border: none; background: none; }
  #viewbar button:hover { background: var(--panel-2); }

  aside {
    grid-area: tree;
    background: var(--panel);
    border-right: 1px solid var(--line);
    overflow-y: auto;
  }
  aside h2 {
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-2);
    padding: 10px 12px 6px;
  }
  #tree { list-style: none; }
  #tree li {
    padding: 5px 12px 5px 22px;
    cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #tree li:hover { background: var(--panel-2); }
  #tree li.body { padding-left: 12px; font-weight: 600; }
  #tree li img {
    width: 15px; height: 15px;
    vertical-align: -3px; margin-right: 6px;
  }
  #tree li.error { color: var(--error); }
  #tree li .kind { color: var(--ink-2); }
  #tree li.rollback {
    color: var(--accent); font-size: 11px; text-align: center;
    border-top: 1px dashed var(--accent);
    border-bottom: 1px dashed var(--accent);
    margin: 3px 10px; padding: 2px;
    cursor: default;
  }

  main { grid-area: viewport; position: relative; }
  main canvas { display: block; }

  #sketchbar {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    display: none; gap: 4px; z-index: 5;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px; padding: 5px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.45);
  }
  #sketchbar button.on { border-color: var(--accent); color: var(--accent); }
  #sketchbar .ok { color: #6fbf8f; }
  #sketchbar .no { color: var(--error); }

  footer {
    grid-area: status;
    display: flex; align-items: center; gap: 16px;
    padding: 0 12px;
    background: var(--panel);
    border-top: 1px solid var(--line);
    font-size: 12px; color: var(--ink-2);
  }
  footer .err { color: var(--error); }
  footer .push { margin-left: auto; }

  #ctxmenu {
    position: fixed; z-index: 10; display: none;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.5);
    min-width: 190px; padding: 4px;
  }
  #ctxmenu div {
    padding: 6px 10px; border-radius: 4px; cursor: pointer;
  }
  #ctxmenu div:hover { background: var(--panel); color: var(--accent); }
  #ctxmenu div.danger:hover { color: var(--error); }
</style>
</head>
<body>
  <header>
    <div class="logo">Free<span>Solid</span></div>
    <button id="btn-new"><img src="icons/document-new.svg" alt="">Nouvelle pièce</button>
    <button id="btn-sketch"><img src="icons/Sketcher_NewSketch.svg" alt="">Esquisse</button>
    <button id="btn-pad"><img src="icons/PartDesign_Pad.svg" alt="">Bossage extrudé</button>
    <button id="btn-pocket"><img src="icons/PartDesign_Pocket.svg" alt="">Enlèvement de matière</button>
    <button id="btn-fillet"><img src="icons/PartDesign_Fillet.svg" alt="">Congé</button>
    <button id="btn-chamfer"><img src="icons/PartDesign_Chamfer.svg" alt="">Chanfrein</button>
    <button id="btn-open"><img src="icons/document-open.svg" alt="">Ouvrir</button>
    <button id="btn-save"><img src="icons/document-save.svg" alt="">Enregistrer</button>
    <button id="btn-selftest">Selftest</button>
  </header>

  <aside>
    <h2>FeatureManager</h2>
    <ul id="tree"><li class="body">— aucun document —</li></ul>
  </aside>

  <main id="viewport">
    <div id="viewbar">
      <button id="view-iso" title="Vue isométrique (Ctrl+7)"><img src="icons/view-isometric.svg" alt=""></button>
      <button id="view-front" title="Vue de face (Ctrl+1)"><img src="icons/view-front.svg" alt=""></button>
      <button id="view-top" title="Vue de dessus (Ctrl+5)"><img src="icons/view-top.svg" alt=""></button>
      <button id="view-right" title="Vue de droite (Ctrl+4)"><img src="icons/view-right.svg" alt=""></button>
      <button id="view-fit" title="Zoom au mieux (F)"><img src="icons/zoom-fit-best.svg" alt=""></button>
    </div>
    <div id="sketchbar">
      <button data-tool="select" title="Glisser un point (le solveur suit)">Sélectionner</button>
      <button data-tool="line" title="L"><img src="icons/Sketcher_CreateLine.svg" alt="">Ligne</button>
      <button data-tool="rect" title="R"><img src="icons/Sketcher_CreateRectangle.svg" alt="">Rectangle par sommet</button>
      <button data-tool="circle" title="C"><img src="icons/Sketcher_CreateCircle.svg" alt="">Cercle</button>
      <button data-tool="dim" title="D — cote pilotante"><img src="icons/Constraint_Dimension.svg" alt="">Cotation intelligente</button>
      <button id="sk-finish" class="ok" title="Fermer l'esquisse et reconstruire"><img src="icons/Sketcher_LeaveSketch.svg" alt="">Terminer</button>
      <button id="sk-cancel" class="no"><img src="icons/Sketcher_CancelSketch.svg" alt="">Quitter</button>
    </div>
  </main>
  <div id="ctxmenu">
    <div id="ctx-rollback">Amener la barre de retour ici</div>
    <div id="ctx-end">Revenir à l'état final</div>
    <div id="ctx-delete" class="danger">Supprimer</div>
  </div>

  <footer>
    <span id="status">Moteur : en attente…</span>
    <span id="pick" class="push"></span>
    <span>MMGS</span>
  </footer>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
