# Application de bureau : construit les installeurs (Linux, Windows, macOS),
# les signe pour l'updater et publie la release GitHub avec le
# `latest.json` que les apps installées consultent au démarrage.
#
# Deux façons de lancer une release :
#   - pousser un tag `v<version>` ;
#   - onglet Actions → « Release desktop » → Run workflow, avec le numéro
#     de version : le workflow crée alors le tag lui-même sur le commit
#     choisi (par défaut la tête de main).
# Dans les deux cas, la version doit être celle de VERSION et de
# desktop/src-tauri/tauri.conf.json.
#
# Secrets attendus :
#   TAURI_SIGNING_PRIVATE_KEY           clé privée minisign (desktop/README.md)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  son mot de passe (ne pas créer si aucun)
name: Release desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. 0.1.1) — doit être celle du fichier VERSION"
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    name: Version déclarée = tag demandé
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: VERSION, tauri.conf.json et le tag doivent dire la même chose
        id: check
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          conf=$(python3 -c 'import json; print(json.load(open("desktop/src-tauri/tauri.conf.json"))["version"])')
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(printf '%s' "$REQUESTED" | tr -d '[:space:]' | sed 's/^v//')"
            # Lancement manuel : le tag ne doit pas déjà exister, sinon la
            # release existante serait modifiée sans que l'updater le voie.
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
              echo "::error::Le tag $tag existe déjà : montez la version dans VERSION et tauri.conf.json, puis relancez."
              exit 1
            fi
          fi
          if [ "$conf" != "$version" ] || [ "v$version" != "$tag" ]; then
            echo "::error::VERSION dit $version, tauri.conf.json dit $conf, le tag dit $tag : alignez les trois (desktop/README.md)."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release $tag depuis $GITHUB_SHA"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            target: ""
          - platform: windows-latest
            args: ""
            target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Dépendances Linux (webkit2gtk, AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libxdo-dev libssl-dev

      - name: CLI Tauri
        working-directory: desktop
        run: npm ci

      # La clé est un seul bloc base64 (fichier écrit par `tauri signer
      # generate`). Un copier-coller depuis un terminal y laisse souvent des
      # retours à la ligne ou le prompt du shell collé à la fin : on nettoie
      # et on vérifie avant de signer, pour échouer avec un message clair
      # plutôt qu'après six minutes de compilation.
      - name: Clé de signature de l'updater
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$RAW_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY absent (desktop/README.md)."
            exit 1
          fi
          key=$(printf '%s' "$RAW_KEY" | tr -d '\r\n\t ' | sed -E 's/[^A-Za-z0-9+\/=].*$//')
          echo "::add-mask::$key"
          if [ $(( ${#key} % 4 )) -ne 0 ] || ! printf '%s' "$key" | base64 --decode > /dev/null 2>&1; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY n'est pas du base64 valide (${#key} caractères après nettoyage). Recollez le contenu exact du fichier .key, sans rien avant ni après."
            exit 1
          fi
          keyfile="$RUNNER_TEMP/freesolid-updater.key"
          printf '%s' "$key" > "$keyfile"
          echo "TAURI_SIGNING_PRIVATE_KEY=$keyfile" >> "$GITHUB_ENV"
          echo "Clé de signature : ${#key} caractères, fichier prêt."

      - name: Build + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          # Tag poussé, ou créé ici par tauri-action sur le commit courant
          # quand le workflow est lancé à la main.
          tagName: ${{ needs.version.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseName: "FreeSolid ${{ needs.version.outputs.tag }}"
          releaseBody: |
            **Version de développement, non fonctionnelle** : un prototype
            pour essayer et remonter des problèmes, pas pour produire des pièces.

            Application de bureau FreeSolid. FreeCAD est détecté sur la machine,
            ou installé automatiquement au premier lancement.
            Les apps déjà installées se mettent à jour d'elles-mêmes.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
