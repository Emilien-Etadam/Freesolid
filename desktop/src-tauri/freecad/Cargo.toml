[package]
name = "freesolid-freecad"
version = "0.1.0"
edition = "2021"
description = "Localisation, installation et lancement de FreeCAD headless pour FreeSolid"
license = "LGPL-2.1-or-later"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
sevenz-rust = "0.6"

[dev-dependencies]
tempfile = "3"
