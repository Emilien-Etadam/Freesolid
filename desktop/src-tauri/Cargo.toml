[package]
name = "freesolid-desktop"
version = "0.1.0"
edition = "2021"
description = "FreeSolid — application de bureau"
license = "LGPL-2.1-or-later"

[workspace]
members = ["freecad"]

[lib]
name = "freesolid_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
freesolid-freecad = { path = "freecad" }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
