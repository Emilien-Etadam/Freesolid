<?xml version="1.0" encoding="UTF-8"?>
<!--
  FreeSolid preference pack.

  Applied from Edit > Preferences > General > Preference packs, or in one
  click via the "Configurer FreeSolid" command, which additionally reports
  what it changed.

  Kept intentionally small: only the settings that a designer coming from
  commercial parametric CAD notices within the first ten minutes.
-->
<FCParameters>
  <FCParamGroup Name="Root">
    <FCParamGroup Name="BaseApp">
      <FCParamGroup Name="Preferences">
        <FCParamGroup Name="View">
          <FCText Name="NavigationStyle">Gui::BlenderNavigationStyle</FCText>
        </FCParamGroup>
        <FCParamGroup Name="General">
          <FCText Name="AutoloadModule">PartDesignWorkbench</FCText>
        </FCParamGroup>
      </FCParamGroup>
    </FCParamGroup>
  </FCParamGroup>
</FCParameters>
